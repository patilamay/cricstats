name: Refresh data and deploy

# Publishes the site to GitHub Pages, in one of two modes:
#  - full refresh: rebuilds every stat from Cricsheet and Wikipedia (~20-30 min). Runs on the daily
#    schedule, when the data pipeline itself changes, or when started by hand with "refresh data" ticked.
#  - site only: reuses the data published by the last full refresh (the "data" release) and just
#    rebuilds the website (~3 min). Used for every other change.
on:
  schedule:
    - cron: '17 6 * * *' # daily, 06:17 UTC (Cricsheet usually publishes overnight UK time)
  push:
    branches: [master]
    paths-ignore: ['worker/**'] # the Ask worker deploys separately (worker.yml)
  pull_request: # build and report only; never deploys
    paths-ignore: ['worker/**']
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Re-download Cricsheet and Wikipedia data (unticked = rebuild the site only)
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write # publish the database release
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # to see which files a push changed

      - name: Decide between a full refresh and a site-only build
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REFRESH: ${{ inputs.refresh_data }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          full=false
          case "$EVENT" in
            schedule) full=true ;;
            workflow_dispatch) [ "$REFRESH" = "true" ] && full=true ;;
            *)
              base="${PR_BASE:-$BEFORE}"
              if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
                full=true
              elif git diff --name-only "$base" HEAD | grep -qE '^(pipeline/|package(-lock)?\.json$)'; then
                echo "The data pipeline changed, so the data is rebuilt."
                full=true
              fi ;;
          esac
          if [ "$full" = false ]; then
            # Reuse the last full refresh. If it isn't there (first run), fall back to a full refresh.
            mkdir -p .cache/release
            if gh release download data -D .cache/release -p cricstats-site-data.zip -p cricstats-parquet.zip --clobber; then
              rm -rf public/data && mkdir -p public/data .cache/db
              unzip -q .cache/release/cricstats-site-data.zip -d public/data
              unzip -q .cache/release/cricstats-parquet.zip -d .cache/db
              echo "Site-only build using the data from the last full refresh."
            else
              echo "::notice::No saved site data yet, so this run does a full refresh."
              full=true
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test the stats rules
        run: npm test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Wikipedia pages are cached between runs; only changed pages are downloaded again.
      - name: Restore Wikipedia cache
        if: steps.mode.outputs.full == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/wiki
          key: wiki-cache-${{ github.run_id }}
          restore-keys: wiki-cache-

      - name: Download Cricsheet and Wikipedia data and compute stats
        if: steps.mode.outputs.full == 'true'
        run: npm run data -- --export .cache/export

      - name: Build the downloadable database (DuckDB + Parquet)
        if: steps.mode.outputs.full == 'true'
        run: |
          python3 -m pip install --quiet duckdb
          python3 pipeline/make_db.py .cache/export .cache/db
          (cd .cache/db && zip -q -r ../cricstats-parquet.zip parquet README.md)
          # The site's own JSON files, so code-only changes can redeploy without recomputing everything.
          (cd public/data && zip -q -r ../../.cache/cricstats-site-data.zip .)
          gzip -c .cache/db/cricstats.duckdb > .cache/cricstats.duckdb.gz
          ls -la .cache/cricstats-parquet.zip .cache/cricstats.duckdb.gz .cache/db/cricstats.duckdb

      - name: Publish the database as the "data" release
        if: github.event_name != 'pull_request' && steps.mode.outputs.full == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Full CricStats database, rebuilt $(date -u +%Y-%m-%d). cricstats.duckdb.gz: DuckDB database (gunzip first). cricstats-parquet.zip: one Parquet file per table. Data: Cricsheet (ODC-BY 1.0) and Wikipedia (CC BY-SA 4.0)."
          gh release view data >/dev/null 2>&1 || gh release create data --title "CricStats database" --notes "$notes" --latest=false
          gh release edit data --notes "$notes"
          gh release upload data .cache/cricstats.duckdb.gz .cache/cricstats-parquet.zip .cache/cricstats-site-data.zip .cache/db/README.md --clobber

      - name: Report on the data
        if: steps.mode.outputs.full == 'true'
        run: node pipeline/report.js

      - name: Build site
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      # The Ask page queries these Parquet files in the browser (DuckDB-WASM, HTTP range requests).
      - name: Add the Parquet tables to the site
        run: |
          mkdir -p dist/db
          cp .cache/db/parquet/*.parquet dist/db/
          # Self-host DuckDB's Parquet reader so the Ask page doesn't depend on extensions.duckdb.org.
          # (If this fails the page still works: DuckDB falls back to downloading it from there.)
          v=$(grep -ao 'v1\.[0-9]\+\.[0-9]\+' node_modules/@duckdb/duckdb-wasm/dist/duckdb-eh.wasm | sort -uV | tail -1)
          for p in wasm_eh wasm_mvp; do
            mkdir -p "dist/duckdb-ext/$v/$p"
            curl -fsSL --retry 3 -o "dist/duckdb-ext/$v/$p/parquet.duckdb_extension.wasm" \
              "https://extensions.duckdb.org/$v/$p/parquet.duckdb_extension.wasm" || echo "::warning::Could not copy the DuckDB Parquet extension ($v/$p)"
          done
          du -sh dist/db dist/duckdb-ext dist

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub pauses scheduled workflows after 60 days without repository activity.
  # This pushes an empty commit once a month so the daily refresh keeps running.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Keep the schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep daily data refresh active [skip ci]"
            git push
          fi
